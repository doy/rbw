[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # this is a timing attack against using the rsa crate for encryption, but
    # we only use rsa decryption here (and rsa 0.9 is only pulled in
    # transitively by ssh-agent-lib -> ssh-key)
    "RUSTSEC-2023-0071",
    # this is only a warning about being unmaintained, the only known
    # undefined behavior is in a function we don't use
    "RUSTSEC-2025-0069",
    # crypto-bigint 0.5 is only pulled in transitively by ssh-agent-lib ->
    # ssh-key -> elliptic-curve, which we don't use
    "RUSTSEC-2026-0387",
    # humantime is only flagged as unmaintained; we only use format_rfc3339
    "RUSTSEC-2026-0542",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
]
skip = [
    # ssh-agent-lib -> ssh-key 0.6 is holding back the older RustCrypto stack
    # and syn 2
    { name = "block-buffer", version = "0.10.4" },
    { name = "cipher", version = "0.4.4" },
    { name = "const-oid", version = "0.9.6" },
    { name = "cpufeatures", version = "0.2.17" },
    { name = "crypto-bigint", version = "0.5.5" },
    { name = "crypto-common", version = "0.1.7" },
    { name = "der", version = "0.7.10" },
    { name = "digest", version = "0.10.7" },
    { name = "getrandom", version = "0.2.17" },
    { name = "hmac", version = "0.12.1" },
    { name = "inout", version = "0.1.4" },
    { name = "pem-rfc7468", version = "0.7.0" },
    { name = "pkcs1", version = "0.7.5" },
    { name = "pkcs8", version = "0.10.2" },
    { name = "rand", version = "0.8.8" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rsa", version = "0.9.10" },
    { name = "sha2", version = "0.10.9" },
    { name = "signature", version = "2.2.0" },
    { name = "spki", version = "0.7.3" },
    { name = "syn", version = "2.0.119" },
    # petgraph 0.8 (via arboard -> wl-clipboard-rs -> tree_magic_mini)
    # depends on hashbrown 0.15 while indexmap uses hashbrown 0.17
    { name = "hashbrown", version = "0.15.5" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
